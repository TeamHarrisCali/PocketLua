[env:cardputer-adv]
; pioarduino: the same Arduino core (3.3.12, ESP-IDF 5.5.5) as the official
; platform, but it can recompile the framework with PocketLua's own settings
; (tier 3 memory work: unused USB features off)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; flashed directly over USB (`pio run -t upload`): the 1200-baud touch puts the
; running firmware's USB serial into the ROM's download mode
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
upload_speed = 921600
extra_scripts = pre:tools/gen_embed.py

board_build.flash_size = 8MB
board_build.partitions = partitions_8MB.csv  ; Arduino's default_8MB.csv, copied: the framework rebuild looks in the project
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_qspi

; USB in TinyUSB mode (keyboard, mouse, drive, serial). Set as the board's
; flags, not build_flags: the framework rebuild compiles the board's flags and
; build_flags together, and two definitions of ARDUINO_USB_MODE fail there.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

build_unflags =
    -Os

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DLUAI_MAXCCALLS=48
    ; pioarduino compiles for size (-Os); the official platform used -O2, and
    ; the Lua VM, the MP3 decoder and TLS are faster with it
    -O2
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -Wno-error

; Tier 3: rebuild the ESP-IDF framework with PocketLua's own settings
; (pioarduino "hybrid compile"; TinyUSB comes from components/arduino_tinyusb).
; PocketLua uses one CDC port (the log and console), MSC (USB drive) and HID
; (keyboard, mouse); the other USB classes held about 18 KB of RAM. Heap
; poisoning (12 bytes of guards on every allocation, the Lua arena's too) is off.
custom_sdkconfig =
    CONFIG_HEAP_POISONING_LIGHT=n
    CONFIG_HEAP_POISONING_DISABLED=y
    CONFIG_TINYUSB_CDC_MAX_PORTS=1
    CONFIG_TINYUSB_NCM_ENABLED=n
    CONFIG_TINYUSB_AUDIO_ENABLED=n
    CONFIG_TINYUSB_VIDEO_ENABLED=n
    CONFIG_TINYUSB_MIDI_ENABLED=n
    CONFIG_TINYUSB_DFU_ENABLED=n
    CONFIG_TINYUSB_DFU_RT_ENABLED=n
    CONFIG_TINYUSB_VENDOR_ENABLED=n

lib_deps =
    jgromes/RadioLib@^7.1.0
    mikalhart/TinyGPSPlus@^1.1.0
    m5stack/M5Cardputer
    m5stack/M5Unified
    m5stack/M5GFX
