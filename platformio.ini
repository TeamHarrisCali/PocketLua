[env:cardputer-adv]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; flashed directly over USB (`pio run -t upload`): the 1200-baud touch puts the
; running firmware's USB serial into the ROM's download mode
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
upload_speed = 921600
extra_scripts = pre:tools/gen_embed.py

board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_qspi

build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=1
    -DLUAI_MAXCCALLS=48
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -Wno-error

lib_deps =
    jgromes/RadioLib@^7.1.0
    mikalhart/TinyGPSPlus@^1.1.0
    m5stack/M5Cardputer
    m5stack/M5Unified
    m5stack/M5GFX
